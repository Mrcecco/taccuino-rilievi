<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taccuino fitosociologico — Rilievi vegetazionali</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#f6f4ec;--paper-2:#efece0;--ink:#222a23;--ink-soft:#4a5349;
    --line:#d4cfbd;--line-strong:#bcb59c;--moss:#566b3f;--moss-deep:#3c4d2c;
    --ochre:#a8752c;--ochre-soft:#f0e6d2;--lichen:#8a9382;--danger:#9a4b3b;--ok:#4f6b3a;
    --shadow:0 1px 0 rgba(60,55,40,.06), 0 8px 24px -16px rgba(40,45,35,.45);
    --mono:'SFMono-Regular',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;
    --serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}

  header.app{background:var(--moss-deep);color:var(--paper);padding:14px 22px;display:flex;align-items:center;gap:18px;border-bottom:3px solid var(--ochre)}
  header.app .mark{font-family:var(--serif);font-size:21px;letter-spacing:.2px;font-weight:600;display:flex;align-items:baseline;gap:10px}
  header.app .mark small{font-family:var(--mono);font-size:11px;font-weight:400;color:#cdd6c0;letter-spacing:1.5px;text-transform:uppercase}
  header.app .spacer{flex:1}
  header.app button{background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.35);padding:7px 13px;border-radius:6px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
  header.app button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6)}
  header.app button.primary{background:var(--ochre);border-color:var(--ochre);color:#1c1404;font-weight:600}
  header.app button.primary:hover{background:#bd8537}
  @media (max-width:640px){
    header.app{flex-wrap:wrap;gap:8px;padding:12px 14px}
    header.app .mark{font-size:18px;flex-basis:100%}
    header.app .mark small{display:none}
    header.app .spacer{display:none}
    header.app button{flex:1 1 30%;padding:10px 8px;font-size:13px}
  }

  .wrap{display:flex;min-height:calc(100vh - 55px)}
  aside{width:288px;flex:none;background:var(--paper-2);border-right:1px solid var(--line);display:flex;flex-direction:column}
  aside .side-head{padding:14px 16px 8px;font-family:var(--mono);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center}
  aside .side-head .count{background:var(--line);border-radius:20px;padding:1px 8px;color:var(--ink-soft)}
  .rel-list{overflow-y:auto;flex:1;padding:0 10px 16px}
  .rel-item{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
  .rel-item:hover{border-color:var(--lichen)}
  .rel-item.active{border-color:var(--moss);box-shadow:inset 3px 0 0 var(--moss)}
  .rel-item .code{font-family:var(--mono);font-weight:600;font-size:13px}
  .rel-item .meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .rel-item .meta b{font-weight:600;color:var(--ink)}
  .rel-empty{padding:24px 16px;color:var(--ink-soft);font-size:13px;text-align:center;line-height:1.6}

  main{flex:1;overflow-y:auto;padding:22px 26px 60px;max-width:1020px}
  .blank{text-align:center;color:var(--ink-soft);padding:80px 20px}
  .blank h2{font-family:var(--serif);color:var(--ink);font-weight:600;margin:0 0 8px}
  .blank p{max-width:440px;margin:0 auto 18px;line-height:1.6}

  .ed-title{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;flex-wrap:wrap}
  .ed-title h1{font-family:var(--serif);font-size:24px;font-weight:600;margin:0;color:var(--ink)}
  .ed-title .sub{color:var(--ink-soft);font-size:13px}
  .ed-actions{margin:10px 0 22px;display:flex;gap:8px;flex-wrap:wrap}
  .ed-actions button{border:1px solid var(--line-strong);background:var(--paper);padding:7px 13px;border-radius:6px;font-size:13px;color:var(--ink);font-weight:500}
  .ed-actions button:hover{border-color:var(--moss);color:var(--moss-deep)}
  .ed-actions button.del{color:var(--danger);border-color:#e0c4bc}
  .ed-actions button.del:hover{background:#f4e6e2}

  fieldset.card{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:16px 18px 18px;margin:0 0 18px;box-shadow:var(--shadow)}
  fieldset.card>legend{font-family:var(--mono);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--moss-deep);padding:0 8px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
  .grid.three{grid-template-columns:repeat(3,1fr)}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12px;color:var(--ink-soft);font-weight:600}
  .field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:6px;background:#fff;padding:8px 10px;width:100%}
  .field input:focus,.field select:focus,.field textarea:focus,.sp-row select:focus,.sp-row input:focus{outline:2px solid var(--moss);outline-offset:-1px;border-color:var(--moss)}
  .field textarea{resize:vertical;min-height:54px}

  .gps-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .gps-bar button{background:var(--moss);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px}
  .gps-bar button:hover{background:var(--moss-deep)}
  .gps-bar .hint{font-size:12px;color:var(--ink-soft)}
  .gps-bar .acc{font-family:var(--mono);font-size:11px;color:var(--moss-deep);background:#e7ecde;border-radius:5px;padding:2px 7px}

  .sp-add{display:flex;gap:8px;margin-bottom:12px;position:relative}
  .sp-add input{flex:1;border:1px solid var(--line-strong);border-radius:6px;background:#fff;padding:9px 11px}
  .sp-add button{background:var(--moss);color:#fff;border:none;border-radius:6px;padding:0 16px;font-weight:600;font-size:13px}
  .sp-add button:hover{background:var(--moss-deep)}
  .suggest{position:absolute;top:42px;left:0;right:74px;z-index:20;background:#fff;border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);max-height:240px;overflow-y:auto}
  .suggest div{padding:7px 11px;cursor:pointer;font-style:italic;border-bottom:1px solid var(--paper-2)}
  .suggest div:last-child{border-bottom:none}
  .suggest div:hover,.suggest div.hl{background:var(--ochre-soft)}
  .suggest .new{font-style:normal;color:var(--moss-deep);font-weight:600}

  .sp-list{margin-top:2px}
  .sp-headrow,.sp-row{display:grid;grid-template-columns:minmax(0,1.5fr) 150px 78px minmax(0,1fr) 30px;gap:8px;align-items:center}
  .sp-headrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;padding:0 4px 6px;border-bottom:2px solid var(--line-strong)}
  .sp-row{padding:6px 4px;border-bottom:1px solid var(--paper-2)}
  .sp-row:hover{background:#fcfbf6}
  .sp-name{font-style:italic;font-weight:500;word-break:break-word;line-height:1.3}
  .sp-row select,.sp-row input{border:1px solid var(--line);border-radius:5px;padding:6px;background:#fff;width:100%}
  .sp-row select.bb{font-family:var(--mono);font-weight:700;text-align:center}
  .sp-row .rm{background:none;border:none;color:var(--lichen);font-size:18px;line-height:1;padding:0;width:auto;justify-self:center;cursor:pointer}
  .sp-row .rm:hover{color:var(--danger)}
  .sp-empty{color:var(--ink-soft);padding:14px 6px;font-size:13px}
  .sp-count{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:10px}
  @media (max-width:560px){
    .sp-headrow{display:none}
    .sp-row{grid-template-columns:1fr 1fr auto;grid-template-areas:"name name rm" "strato bb bb" "note note note";gap:8px;padding:12px 2px;border-bottom:1px solid var(--line)}
    .sp-name{grid-area:name;font-size:14.5px;align-self:center}
    .sp-row .c-strato{grid-area:strato}
    .sp-row .c-bb{grid-area:bb}
    .sp-row .c-note{grid-area:note}
    .sp-row .rm{grid-area:rm;font-size:22px;padding:0 4px}
    .sp-row select,.sp-row input{padding:9px 8px;font-size:15px}
  }

  fieldset.habitat{border-color:var(--ochre);background:linear-gradient(180deg,#fffdf8,#fbf6ea)}
  fieldset.habitat>legend{color:var(--ochre)}
  .hab-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .hab-row button{border:1px solid var(--ochre);background:var(--ochre);color:#fff;border-radius:6px;padding:8px 14px;font-weight:600;font-size:13px}
  .hab-row button:hover{background:#946524}
  .hab-row button.ghost{background:transparent;color:var(--ochre)}
  .hab-row button.ghost:hover{background:var(--ochre-soft)}
  .hab-card{border:1px solid var(--line);border-left:4px solid var(--moss);border-radius:8px;background:#fff;padding:11px 14px;margin-bottom:9px}
  .hab-card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .hab-card .hcode{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--moss-deep)}
  .hab-card .hcode .prio{color:var(--ochre)}
  .hab-card .hname{font-weight:600}
  .hab-card .score{margin-left:auto;font-family:var(--mono);font-size:11px;color:#fff;background:var(--moss);border-radius:20px;padding:2px 9px}
  .hab-card .basis{font-size:12px;color:var(--ink-soft);margin-top:5px}
  .hab-card .basis i{font-style:italic;color:var(--moss-deep)}
  .ai-out{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.6;margin-top:4px}
  .ai-out h4{margin:0 0 6px;font-family:var(--serif)}
  .note-line{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.5}
  .note-line b{color:var(--ochre)}

  .modal-bg{position:fixed;inset:0;background:rgba(34,42,35,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--paper);border-radius:12px;width:580px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
  .modal h3{font-family:var(--serif);margin:0;padding:18px 20px 4px;font-size:19px}
  .modal .mtools{padding:6px 20px 12px;color:var(--ink-soft);font-size:13px;line-height:1.5}
  .modal .mbody{padding:0 20px;overflow-y:auto;flex:1}
  .modal textarea{width:100%;min-height:110px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;resize:vertical;font-family:var(--mono);font-size:12.5px;background:#fff}
  .modal .filt{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;background:#fff;margin:12px 0 4px}
  .sp-master{list-style:none;margin:6px 0 0;padding:0}
  .sp-master li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);font-style:italic;font-size:13px}
  .sp-master li button{background:none;border:none;color:var(--lichen);font-size:16px;padding:2px 6px}
  .sp-master li button:hover{color:var(--danger)}
  .modal .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .modal .mfoot button{padding:8px 16px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;font-weight:500}
  .modal .mfoot button.primary{background:var(--moss);color:#fff;border-color:var(--moss)}
  .modal .mfoot button.warn{color:var(--ochre);border-color:var(--ochre)}
  .modal input.file{font-size:12px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:8px;font-size:13px;z-index:200;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.err{background:var(--danger)}

  @media (max-width:860px){
    .wrap{flex-direction:column}
    aside{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:200px}
    .grid,.grid.three{grid-template-columns:1fr}
    main{padding:18px 16px 50px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
  header.app{padding-top:calc(14px + var(--sat))}
  main{padding-bottom:calc(60px + var(--sab))}
  .toast{bottom:calc(22px + var(--sab))}
  @media (max-width:640px){header.app{padding-top:calc(12px + var(--sat))}}
</style>
</head>
<body>
<header class="app">
  <div class="mark">Taccuino fitosociologico <small>rilievi · habitat</small></div>
  <div class="spacer"></div>
  <button onclick="openSpecies()">Elenco specie</button>
  <button onclick="newRilievo()">Nuovo rilievo</button>
  <button onclick="openData()">Dati</button>
  <button class="primary" onclick="exportExcel()">Esporta Excel</button>
</header>

<div class="wrap">
  <aside>
    <div class="side-head"><span>Rilievi</span><span class="count" id="relCount">0</span></div>
    <div class="rel-list" id="relList"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
const BB=["r","+","1","2","3","4","5"];
const STRATI=[["T","Arboreo (T)"],["S","Arbustivo (S)"],["H","Erbaceo (H)"],["M","Muscinale/lich. (M)"]];

let state={rilievi:[],specie:[],activeId:null,apiKey:'',apiModel:''};
let storageOk=true;

const SKEY='fito:state';
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}

async function loadState(){
  let raw=lsGet(SKEY);
  if(!raw){try{if(window.storage&&window.storage.get){const r=await window.storage.get(SKEY);if(r&&r.value)raw=r.value;}}catch(e){}}
  if(raw){try{state=JSON.parse(raw);}catch(e){}}
  if(!state.specie||!state.specie.length) state.specie=[...SEED_SPECIE];
  if(!state.rilievi) state.rilievi=[];
}
async function saveState(){
  const data=JSON.stringify(state);
  let ok=lsSet(SKEY,data);
  try{if(window.storage&&window.storage.set){await window.storage.set(SKEY,data);ok=true;}}catch(e){}
  storageOk=ok;
}

const $=id=>document.getElementById(id);
function uid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(s){return (s||'').toLowerCase().trim().replace(/\s+(subsp|var|ssp|f)\.?\s+.*/,'').replace(/\s+[A-Z(].*$/,'').split(/\s+/).slice(0,2).join(' ');}
let toastT;
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast show'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',2900);}
function activeRilievo(){return state.rilievi.find(r=>r.id===state.activeId);}

function renderList(){
  $('relCount').textContent=state.rilievi.length;
  const box=$('relList');
  if(!state.rilievi.length){box.innerHTML='<div class="rel-empty">Nessun rilievo.<br>Premi <b>Nuovo rilievo</b> per cominciare.</div>';return;}
  box.innerHTML=state.rilievi.map(r=>`
    <div class="rel-item ${r.id===state.activeId?'active':''}" onclick="selectRilievo('${r.id}')">
      <div class="code">${esc(r.code||'(senza codice)')}</div>
      <div class="meta"><b>${esc(r.data||'—')}</b> · ${esc(r.localita||'località n.d.')}</div>
      <div class="meta">${(r.specie||[]).length} specie${r.quota?` · ${esc(r.quota)} m`:''}</div>
    </div>`).join('');
}

function renderMain(){
  const r=activeRilievo(); const main=$('main');
  if(!r){
    main.innerHTML=`<div class="blank">
      <h2>Taccuino fitosociologico</h2>
      <p>Base specie: <b>checklist della flora d'Abruzzo</b> (Bartolucci et al.). Compila i rilievi con indice
      di Braun‑Blanquet, strato e note per specie; acquisisci i dati stazionali dal GPS; esporta un foglio
      Excel per rilievo più la tabella sinottica. Su richiesta propone gli habitat di Direttiva 92/43/CEE.</p>
      <button onclick="newRilievo()" style="background:var(--moss);color:#fff;border:none;padding:10px 20px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer">Crea il primo rilievo</button>
    </div>`;
    return;
  }
  main.innerHTML=editorHTML(r); bindEditor(r);
}
function val(r,k){return esc(r[k]||'');}

function editorHTML(r){
  const acc=r._gpsAcc?`<span class="acc">±${esc(r._gpsAcc)} m</span>`:'';
  return `
  <div class="ed-title">
    <h1>${esc(r.code||'Nuovo rilievo')}</h1>
    <span class="sub">${(r.specie||[]).length} specie · ultima modifica ${esc(r._upd||'—')}</span>
  </div>
  <div class="ed-actions">
    <button onclick="duplicateRilievo()">Duplica</button>
    <button onclick="exportExcel()">Esporta tutti in Excel</button>
    <button class="del" onclick="deleteRilievo()">Elimina rilievo</button>
  </div>

  <fieldset class="card"><legend>Intestazione</legend>
    <div class="grid">
      <div class="field"><label>Codice rilievo</label><input data-k="code" value="${val(r,'code')}"></div>
      <div class="field"><label>Data</label><input data-k="data" type="date" value="${val(r,'data')}"></div>
      <div class="field"><label>Rilevatore</label><input data-k="rilevatore" value="${val(r,'rilevatore')}"></div>
      <div class="field"><label>Località</label><input data-k="localita" value="${val(r,'localita')}"></div>
      <div class="field"><label>Comune</label><input data-k="comune" value="${val(r,'comune')}"></div>
      <div class="field"><label>Coordinate (lat, lon)</label><input data-k="coord" value="${val(r,'coord')}"></div>
    </div>
  </fieldset>

  <fieldset class="card"><legend>Parametri stazionali</legend>
    <div class="gps-bar">
      <button onclick="gpsFill()">Rileva posizione da GPS</button>
      <span class="hint">compila coordinate, quota e (se disponibile) comune</span>
      ${acc}
    </div>
    <div class="grid three">
      <div class="field"><label>Quota (m s.l.m.)</label><input data-k="quota" inputmode="numeric" value="${val(r,'quota')}"></div>
      <div class="field"><label>Esposizione</label><input data-k="esposizione" placeholder="es. NE" value="${val(r,'esposizione')}"></div>
      <div class="field"><label>Inclinazione (°)</label><input data-k="inclinazione" inputmode="numeric" value="${val(r,'inclinazione')}"></div>
      <div class="field"><label>Superficie rilievo (m²)</label><input data-k="superficie" inputmode="numeric" value="${val(r,'superficie')}"></div>
      <div class="field"><label>Copertura totale (%)</label><input data-k="copTot" inputmode="numeric" value="${val(r,'copTot')}"></div>
      <div class="field"><label>Substrato / litologia</label><input data-k="substrato" value="${val(r,'substrato')}"></div>
      <div class="field"><label>Cop. strato arboreo (%)</label><input data-k="copT" inputmode="numeric" value="${val(r,'copT')}"></div>
      <div class="field"><label>Cop. strato arbustivo (%)</label><input data-k="copS" inputmode="numeric" value="${val(r,'copS')}"></div>
      <div class="field"><label>Cop. strato erbaceo (%)</label><input data-k="copH" inputmode="numeric" value="${val(r,'copH')}"></div>
    </div>
    <div class="grid" style="margin-top:12px">
      <div class="field full"><label>Note del rilievo</label><textarea data-k="note" placeholder="Annotazioni generali sulla stazione, fisionomia, disturbo, contatti…">${val(r,'note')}</textarea></div>
    </div>
  </fieldset>

  <fieldset class="card"><legend>Specie rilevate</legend>
    <div class="sp-add">
      <input id="spInput" placeholder="Cerca nella flora d'Abruzzo o digita una specie e premi Invio…" autocomplete="off">
      <button onclick="addTypedSpecies()">Aggiungi</button>
      <div class="suggest" id="spSuggest" style="display:none"></div>
    </div>
    <div class="sp-list">
      <div class="sp-headrow"><span>Specie</span><span>Strato</span><span>Indice B‑B</span><span>Note</span><span></span></div>
      <div id="spBody"></div>
    </div>
    <div class="sp-count" id="spCount"></div>
  </fieldset>

  <fieldset class="card habitat"><legend>Habitat di Direttiva 92/43/CEE</legend>
    <div class="hab-row">
      <button class="ghost" onclick="ruleHabitat()">Suggerisci da specie diagnostiche</button>

function touchSoft(){clearTimeout(softT);softT=setTimeout(touch,500);}

let hlIdx=-1;
function setupSearch(){
  const inp=$('spInput'),box=$('spSuggest'); if(!inp)return;
  inp.addEventListener('input',()=>{hlIdx=-1;showSuggest(inp.value);});
  inp.addEventListener('keydown',e=>{
    const items=box.querySelectorAll('div');
    if(e.key==='ArrowDown'){e.preventDefault();hlIdx=Math.min(hlIdx+1,items.length-1);paintHl(items);}
    else if(e.key==='ArrowUp'){e.preventDefault();hlIdx=Math.max(hlIdx-1,0);paintHl(items);}
    else if(e.key==='Enter'){e.preventDefault();if(hlIdx>=0&&items[hlIdx])items[hlIdx].click();else addTypedSpecies();}
    else if(e.key==='Escape'){box.style.display='none';}
  });
  box.addEventListener('click',e=>{
    const d=e.target.closest('div'); if(!d)return;
    if(d.dataset.new!==undefined) addTypedSpecies();
    else if(d.dataset.n!==undefined) pickSpecies(d.dataset.n);
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.sp-add'))box.style.display='none';});
}
function paintHl(items){items.forEach((it,i)=>it.classList.toggle('hl',i===hlIdx));}
function showSuggest(q){
  const box=$('spSuggest'); q=q.trim();
  if(!q){box.style.display='none';return;}
  const ql=q.toLowerCase();
  const starts=[],contains=[];
  for(const s of state.specie){
    const l=s.toLowerCase();
    if(l.startsWith(ql))starts.push(s);
    else if(l.includes(ql))contains.push(s);
    if(starts.length>=12)break;
  }
  const matches=starts.concat(contains).slice(0,12);
  let html=matches.map(s=>`<div data-n="${esc(s)}">${esc(s)}</div>`).join('');
  if(!matches.some(s=>s.toLowerCase()===ql)) html+=`<div class="new" data-new>+ Aggiungi «${esc(q)}» come nuova specie</div>`;
  box.innerHTML=html; box.style.display='block';
}
function pickSpecies(nome){addSpeciesToRilievo(nome);$('spInput').value='';$('spSuggest').style.display='none';}
function addTypedSpecies(){

  if(!state.specie.some(s=>s.toLowerCase()===nome.toLowerCase())){state.specie.push(nome);state.specie.sort((a,b)=>a.localeCompare(b,'it'));}

/* ---------- GPS ---------- */
function gpsFill(){
  const r=activeRilievo(); if(!r)return;
  if(!navigator.geolocation){toast('Geolocalizzazione non supportata dal browser',true);return;}
  toast('Acquisizione posizione GPS…');
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=pos.coords;
    r.coord=c.latitude.toFixed(6)+', '+c.longitude.toFixed(6);
    if(c.altitude!=null&&!isNaN(c.altitude))r.quota=String(Math.round(c.altitude));
    r._gpsAcc=c.accuracy?Math.round(c.accuracy):null;
    touch();renderMain();
    toast('Posizione acquisita'+(c.accuracy?` (±${Math.round(c.accuracy)} m)`:'')+(c.altitude==null?' — quota non fornita dal dispositivo':''));
    reverseGeocode(c.latitude,c.longitude,r);
  },err=>{
    let m='GPS non disponibile';
    if(err.code===1)m='GPS bloccato nella pagina incorporata di Claude. Usa la versione ospitata a tutto schermo e consenti la posizione; intanto puoi inserire le coordinate a mano.';
    else if(err.code===2)m='Posizione non determinabile in questo momento';
    else if(err.code===3)m='Timeout GPS: riprova all\'aperto';
    toast(m,true);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
async function reverseGeocode(lat,lon,r){
  try{
    const u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=13&accept-language=it`;
    const resp=await fetch(u,{headers:{'Accept':'application/json'}});
    if(!resp.ok)return;
    const d=await resp.json();const a=d.address||{};
    const comune=a.city||a.town||a.village||a.municipality||a.county||'';
    const loc=a.hamlet||a.suburb||a.locality||a.neighbourhood||a.isolated_dwelling||'';
    let changed=false;
    if(comune&&!r.comune){r.comune=comune;changed=true;}
    if(loc&&!r.localita){r.localita=loc;changed=true;}
    if(changed){touch();if(activeRilievo()===r)renderMain();toast('Comune/località da reverse‑geocoding');}
  }catch(e){/* CORS/CSP o offline: si ignora silenziosamente */}
}

/* ---------- Habitat: regole ---------- */
function ruleHabitat(){
  const r=activeRilievo();
  const present=(r.specie||[]).map(s=>norm(s.nome));
  if(!present.length){$('habOut').innerHTML='<div class="note-line">Aggiungi prima qualche specie al rilievo.</div>';return;}
  const set=new Set(present);
  const scored=HABITATS.map(h=>{const m=h.diag.filter(d=>set.has(norm(d)));return {h,m,sc:m.length/Math.max(3,h.diag.length)*m.length};})
    .filter(x=>x.m.length>0).sort((a,b)=>b.m.length-a.m.length||b.sc-a.sc).slice(0,5);
  if(!scored.length){$('habOut').innerHTML='<div class="note-line">Nessun habitat compatibile fra le specie diagnostiche note. Prova l\'analisi ragionata (AI), che valuta anche contesto e quota.</div>';return;}
  $('habOut').innerHTML=scored.map(({h,m})=>`
    <div class="hab-card">
      <div class="top">
        <span class="hcode">${esc(h.code)}${h.prio?'<span class="prio"> *</span>':''}</span>
        <span class="hname">${esc(h.name)}</span>
        <span class="score">${m.length} sp. diagn.</span>
      </div>
      <div class="basis">Specie diagnostiche presenti: <i>${m.map(esc).join(', ')}</i></div>
    </div>`).join('');
}

/* ---------- Habitat: AI ---------- */
async function getCap(name){try{if(window.claude&&claude.use){return await claude.use(name);}}catch(e){}return null;}
async function offerFile(filename,data,mime){
  const dl=await getCap('downloads');
  if(dl){
    try{await dl.save({filename,data});toast('File pronto: '+filename);return true;}
    catch(e){toast(e&&e.code==='declined'?'Download annullato':'Download non riuscito',true);return false;}
  }
  const blob=(data instanceof Blob)?data:new Blob([data],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  return true;
}
async function callClaude(prompt){
  const sample=await getCap('sample');                 // pagina pubblicata: usa l'AI del runtime
  if(sample){const r=await sample(prompt,{modelTier:'complex'});return ((r&&r.text)||'').trim();}
  const key=(state.apiKey||'').trim();                 // copia locale: API diretta con la tua chiave
  const headers={"Content-Type":"application/json"};
  let model="claude-sonnet-4-20250514";
  if(key){
    headers["x-api-key"]=key;
    headers["anthropic-version"]="2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"]="true";
    model=(state.apiModel||"claude-sonnet-4-6").trim();
  }
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers,
    body:JSON.stringify({model,max_tokens:1000,messages:[{role:"user",content:prompt}]})
  });
  if(!resp.ok){
    let detail='';try{const ej=await resp.json();detail=(ej.error&&ej.error.message)||'';}catch(e){}
    throw new Error('HTTP '+resp.status+(detail?' · '+detail:''));
  }
  const data=await resp.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
}
async function aiHabitat(){
  const r=activeRilievo();
  if(!(r.specie||[]).length){$('habOut').innerHTML='<div class="note-line">Aggiungi prima qualche specie al rilievo.</div>';return;}
  $('habOut').innerHTML='<div class="ai-out">Analisi in corso…</div>';
  const speclist=r.specie.map(s=>`${s.nome} [${s.strato} ${s.bb}]`).join('; ');
  const ctx=[r.quota&&`quota ${r.quota} m`,r.esposizione&&`esposizione ${r.esposizione}`,r.inclinazione&&`inclinazione ${r.inclinazione}°`,r.substrato&&`substrato ${r.substrato}`,r.localita&&`località ${r.localita}`,r.comune&&`comune ${r.comune}`].filter(Boolean).join(', ');
  const prompt=`Sei un fitosociologo esperto degli habitat dell'Allegato I della Direttiva 92/43/CEE in Italia, con riferimento al Manuale italiano di interpretazione (Biondi et al.) e al contesto appenninico.

Dato il seguente rilievo vegetazionale, indica gli habitat di Direttiva più compatibili.
Contesto stazionale: ${ctx||'non specificato'}.
Specie [strato e indice di Braun-Blanquet]: ${speclist}.

Rispondi in italiano, conciso. Per i 2-4 habitat più probabili fornisci:
- codice habitat (con * se prioritario) e denominazione ufficiale;
- specie del rilievo che lo diagnosticano;
- breve motivazione e grado di confidenza (alto/medio/basso);
- eventuali habitat alternativi o note di cautela.
Non inventare specie non presenti. Se la composizione è ambigua, dillo.`;
  try{
    const text=await callClaude(prompt);
    $('habOut').innerHTML=`<div class="ai-out"><h4>Analisi ragionata</h4>${esc(text||'(nessuna risposta)')}</div>`;
  }catch(e){
    const hasKey=(state.apiKey||'').trim();
    $('habOut').innerHTML=`<div class="ai-out" style="border-color:var(--danger)">
      <h4>Analisi AI non disponibile</h4>
      Nella versione <b>pubblicata</b> l'analisi usa l'AI di Claude (serve il consenso alla prima richiesta);
      nella <b>copia locale</b> serve la <b>tua chiave API Anthropic</b> da <b>Impostazioni AI</b>.
      ${hasKey?'<br><br>Dettaglio: '+esc(e.message):''}
      <br><br>Il suggerimento <b>da specie diagnostiche</b> resta sempre disponibile, anche offline.
    </div>`;
  }
}

        Per usarla nella tua copia locale, incolla qui la tua chiave API Anthropic: resta salvata <b>solo in questo browser</b>.</div>

/* ---------- Excel ---------- */
function safeSheet(name,used){
  let n=(name||'rilievo').replace(/[\[\]\:\*\?\/\\]/g,' ').slice(0,28).trim()||'rilievo';
  let base=n,k=2;while(used.has(n.toLowerCase())){n=(base.slice(0,25))+'_'+k++;}used.add(n.toLowerCase());return n;
}
function exportExcel(){
  if(!state.rilievi.length){toast('Nessun rilievo da esportare',true);return;}
  const wb=XLSX.utils.book_new();const used=new Set();
  state.rilievi.forEach(r=>{
    const A=[];
    A.push(['RILIEVO VEGETAZIONALE',r.code||'']);A.push([]);
    A.push(['Data',r.data||'','','Rilevatore',r.rilevatore||'']);
    A.push(['Località',r.localita||'','','Comune',r.comune||'']);
    A.push(['Coordinate',r.coord||'','Precisione GPS (m)',r._gpsAcc||'','Quota (m)',r.quota||'']);
    A.push(['Esposizione',r.esposizione||'','','Inclinazione (°)',r.inclinazione||'']);
    A.push(['Superficie (m²)',r.superficie||'','','Copertura tot. (%)',r.copTot||'']);
    A.push(['Cop. arboreo (%)',r.copT||'','Cop. arbustivo (%)',r.copS||'','Cop. erbaceo (%)',r.copH||'']);
    A.push(['Substrato',r.substrato||'']);A.push(['Note del rilievo',r.note||'']);A.push([]);
    A.push(['Specie','Strato','Indice B-B','Note']);
    (r.specie||[]).forEach(s=>A.push([s.nome,s.strato||'',s.bb||'',s.note||'']));
    A.push([]);A.push(['N. specie',(r.specie||[]).length]);
    const ws=XLSX.utils.aoa_to_sheet(A);
    ws['!cols']=[{wch:34},{wch:16},{wch:18},{wch:14},{wch:14},{wch:20}];
    XLSX.utils.book_append_sheet(wb,ws,safeSheet(r.code,used));
  });
  const allSp=[];
  state.rilievi.forEach(r=>(r.specie||[]).forEach(s=>{if(!allSp.some(x=>x.toLowerCase()===s.nome.toLowerCase()))allSp.push(s.nome);}));
  allSp.sort((a,b)=>a.localeCompare(b,'it'));
  const head=['Specie',...state.rilievi.map(r=>r.code||'')];
  const syn=[head];
  allSp.forEach(name=>{const row=[name];state.rilievi.forEach(r=>{const f=(r.specie||[]).find(s=>s.nome.toLowerCase()===name.toLowerCase());row.push(f?f.bb:'');});syn.push(row);});
  const wsSyn=XLSX.utils.aoa_to_sheet(syn);
  wsSyn['!cols']=[{wch:34},...state.rilievi.map(()=>({wch:11}))];
  XLSX.utils.book_append_sheet(wb,wsSyn,'Tabella sinottica');
  const stamp=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const wbout=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  offerFile('rilievi_vegetazionali_'+stamp+'.xlsx',wbout,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast('Excel pronto · '+state.rilievi.length+' rilievi + tabella sinottica');
}

function paintMaster(){

function importPaste(){
  const txt=$('spPaste').value;
  const names=txt.split(/[\n;]+/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){toast('Niente da importare',true);return;}
  mergeSpecie(names,false);$('spPaste').value='';
}
function mergeSpecie(names,replace){
  let base=replace?[]:[...state.specie];
  const seen=new Set(base.map(s=>s.toLowerCase()));
  names.forEach(n=>{if(!seen.has(n.toLowerCase())){base.push(n);seen.add(n.toLowerCase());}});
  base.sort((a,b)=>a.localeCompare(b,'it'));
  state.specie=base;saveState();paintMaster();
  if(activeRilievo())speciesRows(activeRilievo());
  toast(state.specie.length+' taxa nell\'elenco');
}
function importFile(ev){
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});
      const names=rows.map(r=>r&&r[0]).map(v=>v==null?'':String(v).trim()).filter(v=>v&&!/^(specie|species|taxon|nome)$/i.test(v));
      mergeSpecie(names,false);

  };

function openData(){
  $('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Dati e backup</h3>
      <div class="mtools">I rilievi si salvano <b>da soli</b> nel browser di questo dispositivo. Per sicurezza

        è l'intero archivio, ricaricabile qui senza perdere nulla. L'Excel resta l'output finale per l'analisi.</div>
      <div class="mbody">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px">
          <button onclick="downloadBackup()" style="background:var(--moss);color:#fff;border:none;padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer">Scarica backup (.json)</button>
          <label style="border:1px solid var(--line-strong);padding:9px 14px;border-radius:6px;cursor:pointer;background:#fff">Carica backup (.json)<input type="file" accept=".json,application/json" style="display:none" onchange="loadBackup(event)"></label>
        </div>
        <div class="note-line" id="dataStat"></div>
      </div>
      <div class="mfoot"><button class="primary" onclick="closeModal()">Chiudi</button></div>
    </div></div>`;
  const n=state.rilievi.length,sp=state.specie.length;
  $('dataStat').innerHTML=`Archivio attuale: <b>${n}</b> rilievi · <b>${sp}</b> taxa in elenco. Salvataggio automatico: ${storageOk?'<b style="color:var(--ok)">attivo</b> su questo browser':'<b style="color:var(--danger)">non disponibile</b> qui — affidati al backup'}.`;
}
function downloadBackup(){
  const copy=JSON.parse(JSON.stringify(state));delete copy.apiKey;delete copy.apiModel;
  offerFile('taccuino-backup-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json',JSON.stringify(copy),'application/json');
}
function loadBackup(ev){
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d||!Array.isArray(d.rilievi))throw new Error('formato');
      if(!confirm('Caricare il backup? Sostituirà i rilievi e l\'elenco specie attuali in questo browser.'))return;
      state.rilievi=d.rilievi;
      if(Array.isArray(d.specie)&&d.specie.length)state.specie=d.specie;
      state.activeId=state.rilievi.length?state.rilievi[0].id:null;
      saveState();closeModal();renderList();renderMain();
      toast('Backup caricato · '+state.rilievi.length+' rilievi');
    }catch(err){toast('File di backup non valido',true);}
  };
  reader.readAsText(file);ev.target.value='';
}
